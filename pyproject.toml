[project]
name = "auteur"
version = "0.1.0"
description = "Auteur — an AI film director in your terminal. Pitch → script → cast → storyboard → shoot (LTX-2.5) → cut."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "prompt_toolkit>=3.0.40",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local LTX-2.5 rendering (layer-streamed, AirLLM-style). Diffusers' LTX-2.5 support lives on main.
render = [
    "torch>=2.7",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@48cdbaef5ee3d718aaee392b44f2099ae511c4a5",
    "transformers>=4.57",
    "accelerate>=1.0",
    "safetensors>=0.4.5",
    "huggingface_hub>=0.34",
    "sentencepiece",
    "av>=12",
]

[project.scripts]
auteur = "auteur.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/auteur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs torch + diffusers (render extra)"]
